# ── System packages ──────────────────────────────────────────────────────────
# ffmpeg: audio extraction for the acoustic oracle, and the annotated-video
# finalize pass (H.264 re-encode + original-audio remux).
#
# The X11/OpenGL libraries are a safety net for the OpenCV problem described
# below. They are NOT the primary fix: this image is Nix-based, and
# apt-installed libraries are not reliably on the runtime library path — two
# deploys failed with `ImportError: libxcb.so.1` even with them declared here.
[phases.setup]
aptPkgs = [
    "ffmpeg",
    "libgl1",
    "libglib2.0-0",
    "libxcb1",
    "libsm6",
    "libxext6",
    "libxrender1",
]

# ── Force a headless-only OpenCV ─────────────────────────────────────────────
# THE ACTUAL FIX.
#
# requirements.txt asks for opencv-python-headless, but `ultralytics`
# hard-requires `opencv-python` (the full desktop build), so pip installs BOTH
# into the same cv2/ directory and the desktop build wins at import. It links
# against X11/OpenGL shared objects that a slim server image does not ship,
# crashing the app at startup with `ImportError: libxcb.so.1`.
#
# Rather than supplying GUI libraries to a server that has no display, remove
# the desktop build entirely. Both packages provide the same `cv2` module and
# they overwrite each other's files, so a partial uninstall can leave a broken
# install — hence: purge all variants, then reinstall headless alone.
#
# Verified locally: with only opencv-python-headless present, cv2 imports,
# drawing and VideoCapture work, and ultralytics runs inference normally
# (yolo11m detected a dog at 0.93 on the test frame).
[phases.build]
dependsOn = ["install"]
cmds = [
    "pip uninstall -y opencv-python opencv-contrib-python opencv-python-headless || true",
    "pip install --no-cache-dir opencv-python-headless",
    "python -c \"import cv2; print('cv2 OK', cv2.__version__)\"",
]
